[project]
name = "hopfieldnetwork"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Andrzej", email = "andrzejwrzesinski.2004@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
